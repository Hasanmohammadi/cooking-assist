name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Build web app
        run: pnpm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Add Android platform (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            pnpm exec cap add android
          else
            pnpm exec cap sync android
          fi

      - name: Set min/target/compile SDK versions (Android 7+ to Android 16)
        run: |
          sed -i "s/minSdkVersion = .*/minSdkVersion = 24/" android/variables.gradle
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 36/" android/variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 36/" android/variables.gradle
          cat android/variables.gradle

      - name: Sync web build into Android project
        run: pnpm exec cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cooking-assist-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
